# Runs the model in GitHub's cloud and publishes the password-protected
# website to GitHub Pages -- no laptop needed.
#
# One-time setup (see README "Website without your laptop"):
#   1. Settings -> Secrets and variables -> Actions -> New repository secret
#        Name: UMUSHROOM_PASSWORD   Value: the team password (12+ characters)
#   2. Settings -> Pages -> Build and deployment -> Source: GitHub Actions
#   3. Actions -> Website -> Run workflow   (first run)

name: Website

on:
  schedule:
    # v4.21: two weekday slots. At 06:20 UTC Yahoo had not yet published the
    # previous day's European closes, so every Tue-Fri run of 20-27 Oct 2026
    # used two-day-old signals. The pipeline now refuses stale data (exit 3,
    # "not ready") and deletes that download from the cache (v4.26), so the
    # 11:40 slot asks Yahoo again. When both slots find the closes, both
    # publish; on a rebalance day the second still shows the trade list,
    # against the first run's book (v4.26). UMushroom fills at the previous
    # close whenever the orders are entered, so a later run costs nothing.
    - cron: "40 8 * * 1-5"     # 08:40 UTC = 09:40 London (summer) / 08:40 (winter)
    - cron: "40 11 * * 1-5"    # 11:40 UTC = 12:40 London (summer) / 11:40 (winter)
  workflow_dispatch:
    inputs:
      validate:
        description: "Also run the validation suite (slower)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: website
  cancel-in-progress: false

env:
  TZ: Europe/London          # run times on the site in UK time

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      run_ok: ${{ steps.site.outputs.run_ok }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[site]"

      # v4.27: the saved state (past runs, their plaintext reports, the price
      # cache) is stored ENCRYPTED with the team password. This repository is
      # public and Actions caches can be restored by pull-request workflows,
      # so a plaintext cache bypassed the site's encryption.
      - name: Restore past runs and the price cache (encrypted)
        uses: actions/cache/restore@v4
        with:
          path: state.enc
          key: umushroom-state-${{ github.run_id }}
          restore-keys: umushroom-state-

      # One-time migration: the pre-4.27 plaintext cache, read only when no
      # encrypted state exists yet. Delete the old umushroom-data-* caches
      # (Actions -> Caches) once an encrypted one has been saved.
      - name: Restore pre-4.27 state (migration)
        if: hashFiles('state.enc') == ''
        uses: actions/cache/restore@v4
        with:
          path: |
            site
            .cache
          key: umushroom-data-${{ github.run_id }}
          restore-keys: umushroom-data-

      - name: Decrypt the saved state
        id: unpack
        env:
          UMUSHROOM_PASSWORD: ${{ secrets.UMUSHROOM_PASSWORD }}
        run: |
          if [ -f state.enc ]; then
            # never run (and then save over it) on state we could not read
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:UMUSHROOM_PASSWORD \
              -in state.enc | tar -xzf - \
              || { echo "::error::Cannot decrypt the saved state (was UMUSHROOM_PASSWORD changed?). Nothing was overwritten."; exit 1; }
            rm state.enc
          fi
          if [ ! -d site/reports ]; then
            echo "::warning::No saved run history was restored: the site starts empty (first run, or the cache was evicted)."
          fi

      - name: Run the model and build the encrypted site
        id: site
        env:
          UMUSHROOM_PASSWORD: ${{ secrets.UMUSHROOM_PASSWORD }}
          # v4.27: orders are sized on the account's current total value
          # (Settings -> Secrets and variables -> Actions -> Variables ->
          # ACCOUNT_VALUE, e.g. 98500). Unset = the config's starting_balance.
          UMUSHROOM_ACCOUNT_VALUE: ${{ vars.ACCOUNT_VALUE }}
        run: |
          set +e
          python -m umushroom.static_site --run --out public \
            ${{ inputs.validate && '--validate' || '' }} \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/workflows/website.yml"
          code=$?
          if [ "$code" = "2" ]; then exit 2; fi        # setup error: nothing to publish
          if [ "$code" = "3" ]; then
            echo "::notice::Data not ready: Yahoo has not published yesterday's closes yet. The site keeps the last good run; the later slot retries."
            echo "run_ok=true" >> "$GITHUB_OUTPUT"      # not a failure: nothing to email
          else
            echo "run_ok=$([ "$code" = "0" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          fi

      - name: Encrypt the state to save
        if: always() && steps.unpack.outcome == 'success'
        env:
          UMUSHROOM_PASSWORD: ${{ secrets.UMUSHROOM_PASSWORD }}
        run: |
          dirs=$(ls -d site .cache 2>/dev/null || true)
          if [ -z "$dirs" ]; then echo "Nothing to save."; exit 0; fi
          tar -czf - $dirs | openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -pass env:UMUSHROOM_PASSWORD -out state.enc

      - name: Save past runs and the price cache (encrypted)
        if: always() && steps.unpack.outcome == 'success' && hashFiles('state.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: state.enc
          key: umushroom-state-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # The site is published either way (showing the last good run); this
      # marks the workflow red so GitHub emails you that today's run failed.
      - name: Report a failed model run
        if: needs.build.outputs.run_ok != 'true'
        run: |
          echo "::error::The model run failed - the site shows the last good run. Open the build job's log."
          exit 1
