# Account currency. All prices are converted into this before features,
# backtests and share sizing (London pence are divided by 100 first).
base_currency: "GBP"
# Pin the quote currency for any listing that breaks its exchange's
# usual currency. Most London-listed ETFs trade in USD, not pence.
currency_overrides:
  "IWDA.L": "USD"
  "VUAA.L": "USD"
  "EIMI.L": "USD"
  "IDTL.L": "USD"
  "IB01.L": "USD"
  "SGLD.L": "USD"
  "PHAG.L": "USD"
  "BRNT.L": "USD"
  "CSNDX.SW": "USD"
  "CRH.L": "USD"       # priced from the US listing (see yahoo_symbols)
  "FERG.L": "USD"
  "INDV.L": "USD"
  "FLTR.L": "USD"
  "IGLT.L": "GBP"      # Yahoo quotes this line in POUNDS, not pence (verified
                       # against UMushroom's price on 2026-10-08: GBP 9.48)

# Fetch these tickers' prices from a different Yahoo symbol. CRH, Ferguson
# and Indivior moved their main listing to the US; Yahoo no longer has the
# London lines, but UMushroom still lists them (priced from the US listing,
# verified 2026-10-08). Orders still show the UMushroom ticker.
yahoo_symbols:
  "CRH.L": "CRH"
  "FERG.L": "FERG"
  "INDV.L": "INDV"
  "FLTR.L": "FLUT"      # Flutter: main listing moved to NYSE
  # v4.8, from `python -m umushroom.check_tickers` (2026-10-08):
  "PHNX.L": "SDLF.L"    # Phoenix Group renamed Standard Life
  "TM17.L": "EVPL.L"    # Team17 renamed Everplay
  "HELN.SW": "HBAN.SW"  # Helvetia merged into Helvetia Baloise

# --- Sleeves (v4.2) ---
# Each sleeve has its OWN model, backtest and skill verdict, and a fixed
# share of the balance. The main `tickers` list above is the "equity"
# sleeve and gets whatever weight is left (here 80%, top_n_holdings picks).
# Every instrument below was confirmed on UMushroom on 2026-10-08.
sleeves:
  etf:
    weight: 0.20
    # v4.19 (2026-10-12): the ETF sleeve is now a MODEL sleeve over the whole
    # UMushroom ETF catalogue, not an equal-weight basket of 13.
    #   universe_file  every ETF UMushroom lists that Yahoo can price (2,047 of
    #                  2,261 on 2026-10-12), built by
    #                    python -m umushroom.etf_universe --config config.yaml
    #                  from umushroom_etf_catalogue.json (python -m umushroom.catalogue)
    #   core_tickers   the 13 ETFs the team already trades: always in the
    #                  universe, and what "auto" falls back to
    #   feature_set    trend / asset-class momentum factors (features.py)
    #   group_by       rank bond ETFs against bond ETFs, commodities against
    #                  commodities (UMushroom's own asset classes)
    #   selection      auto = trade the model's top 8 ONLY while the purged
    #                  walk-forward IC is significant AND the picks beat the
    #                  benchmark inside contest-length windows (window.py);
    #                  otherwise hold the 13 core ETFs equal weight. The
    #                  website's ETFs tab shows which applied on each run.
    #   exclude_leveraged  2x/3x/inverse/short ETPs are not ranked (their
    #                  daily-reset decay is nothing the trend factors describe)
    #   exclude_groups crypto ETPs: the team's no-crypto rule (v4.18)
    #   forward_return_days must fit inside contest_window_days (30).
    universe_file: "umushroom_etf_universe.csv"
    exclude_leveraged: true
    exclude_groups: ["crypto"]
    feature_set: "etf"
    group_by: "asset_class"
    max_per_group: 3
    top_n: 8
    # HEAD-TO-HEAD (2026-10-12, 10 years, rule fixed before looking: among
    # horizons with IC t >= 2 keep the highest contest-window active t):
    #   5d  IC t +3.33, 6-week win 57%, 6-week active t +0.67
    #   10d IC t +4.06, 6-week win 49%, 6-week active t +0.73  <- winner
    #   21d IC t +0.74 (no skill)
    # Ranking skill is real at 5-10 days; whether it beats holding every ETF
    # inside one contest window is not yet proven (t < 2), which is exactly
    # what `selection: auto` guards against.
    forward_return_days: 10
    selection: "auto"
    # v4.20 HEAD-TO-HEADS (2026-10-19, full 1,590-ETF universe, 30-day folds):
    #   weighting   equal  alpha -0.4%/yr  win 56%  VaR95/wk 2.86%
    #               hrp    alpha -0.9%/yr  win 47%  VaR95/wk 1.98%  (lost alpha)
    #               factor alpha +2.7%/yr  win 62%  VaR95/wk 2.85%  <- ADOPTED by the rule
    #               (alpha t 0.54: a modest, not yet significant edge in sizing;
    #               an earlier +9.1% came from the unconditioned factor model
    #               before the volatility and weight floors). REVERTED 2026-10-27:
    #               see max_pick_correlation below.
    #   model_type  ridge 6-week active t -0.18 / mlp +0.34 / gbm -0.30: no
    #               learner has a reliable contest-window edge here (all IC t
    #               3.2-3.9). mlp "won" by +0.34 -- noise; ridge kept.
    #   max_pick_correlation  0.90 / 0.95: no improvement -> off.
    # (set explicitly: the top-level model_type is the STOCK sleeve's)
    model_type: "ridge"
    # v4.21 (2026-10-27): the live 27 Oct model book put 72% of the sleeve in
    # three silver ETPs (PHAG 25%, SLVR 22%, ISLN 25%) -- the factor weights
    # loading up one "commodity" exposure through near-identical lines. Two
    # conservative changes, both back toward what was validated:
    #   weighting back to EQUAL (factor's measured edge was alpha t 0.54);
    #   near-duplicate guard ON at 0.90: in its head-to-head it had HIGHER
    #   alpha (+0.21% vs -0.44%) and VaR 2.88% vs 2.86% -- within the 0.05pp
    #   tolerance now written into the rule (selection.VAR_TOLERANCE).
    # Re-run under the fixed history start (2026-10-27, 30-day folds):
    #   guard 0.90  alpha -4.9%/yr  win 51%  VaR 2.94%  vs  no guard -6.4%, 36%, 3.15%
    #   factor      alpha -4.6%/yr  win 44%  VaR 2.83%  (rule: adoptable; kept OFF after
    #               the 72%-silver live book -- and moot while the sleeve holds core)
    # Every variant LOSES to holding every ETF inside a contest window, so with
    # auto_trade_on: pass the sleeve holds the core basket until that changes.
    max_pick_correlation: 0.9
    # Headline on the FULL universe: walk-forward IC t +1.93 (21-day folds),
    # +3.21 (30-day folds); active return ~0: `auto` holds the core basket.
    # The 2026-10-19 20:07 run that traded 8 picks did so on a cache missing
    # 780 symbols (Yahoo rate limit) -- fixed in data.py.
    weighting: "equal"
    core_tickers:
      - "IWDA.L"     # iShares Core MSCI World (USD)
      - "VUAA.L"     # Vanguard S&P 500 (USD)
      - "CSNDX.SW"   # iShares Nasdaq 100 (USD)
      - "EIMI.L"     # iShares Core MSCI EM IMI (USD)
      - "XESC.DE"    # Xtrackers Euro Stoxx 50 (EUR)
      - "ISF.L"      # iShares Core FTSE 100 (GBp)
      - "IGLT.L"     # iShares Core UK Gilts (GBp)
      - "IDTL.L"     # iShares $ Treasury 20+yr (USD)
      - "IB01.L"     # iShares $ Treasury 0-1yr, cash-like (USD)
      - "SGLD.L"     # Invesco Physical Gold (USD)
      - "PHAG.L"     # WisdomTree Physical Silver (USD)
      - "BRNT.L"     # WisdomTree Brent Crude Oil (USD)
      - "INRG.L"     # iShares Global Clean Energy (GBp)
  # v4.18 (2026-10-10): crypto sleeve switched OFF -- the model showed no
  # skill there and holding all 18 coins only added volatility. Its 10% went
  # to the equity sleeve. To turn it back on, remove the '# ' from the lines
  # below.
#   crypto:
#     weight: 0.10
#     top_n: 4
#     # v4.9: crypto model FAILED the validation suite (2026-10-08): placebo
#     # p=0.48 (11/20), deciles not ordered (lowest-ranked did best), edge gone
#     # with a 1-day delay, BTC picked 87% of weeks. Same rule as ETFs: hold all
#     # 18 at equal weight; the model is still reported each run.
#     selection: "all"
#     weighting: "equal"
#     fractional: true   # buys fractions of a coin -- CHECK UMushroom allows this
#     forward_return_days: 5   # crypto's skill was measured at 5 days
#     tickers: ["BTC-USD", "ETH-USD", "SOL-USD", "XRP-USD", "BNB-USD", "ADA-USD",
#               "DOGE-USD", "AVAX-USD", "LINK-USD", "DOT-USD", "LTC-USD", "BCH-USD",
#               "XLM-USD", "TRX-USD", "ATOM-USD", "ETC-USD", "HBAR-USD", "FIL-USD"]

starting_balance: 100000        # contest virtual capital (in base_currency)

# --- v4.20 (2026-10-19; every number below is from ONE pre-declared head-to-head
# on identical data, 568 stocks / 1,590 ETFs, 30-day test folds; see CHANGELOG) ---
#
# Learner for the stock sleeve (sleeves may set their own): ridge | mlp (small
# neural network) | gbm (gradient boosting).
#   python -m umushroom.cli --config config.yaml --compare-model equity:ridge,mlp,gbm
#   ridge  IC t +4.71  6-week active t +2.07  alpha  +9.2%/yr (t 1.91)  VaR95/wk 3.16%
#   mlp    IC t +3.66  6-week active t +2.53  alpha +12.2%/yr (t 2.37)  VaR95/wk 3.50%
#   gbm    IC t +5.08  6-week active t +3.95  alpha +24.2%/yr (t 3.92)  VaR95/wk 3.99%  <- rule: gbm
# gbm wins the rule by a wide, significant margin AND passed the validation
# suite on 2026-10-19 (7/7: placebo 20/20 p=0.048, deciles ordered rho 0.89,
# IC positive 9/9 years, LSE/SIX/US all positive, survives a 1-day delay,
# 526 names picked, max 10%) -> ADOPTED. It takes MORE weekly risk than ridge
# (VaR 3.99% vs 3.16%); HRP below brings that back down.
# Re-check any time: `python -m umushroom.cli --config config.yaml --validate`.
model_type: "gbm"
# Weighting of the stock sleeve: equal | hrp | factor (the walk-forward scores
# the same scheme, capped at 2x equal weight like live orders).
#   python -m umushroom.cli --config config.yaml --compare-weighting equity:equal,hrp,factor
#   equal  alpha  +9.2%/yr (t 1.91)  VaR95/wk 3.16%
#   hrp    alpha +11.9%/yr (t 2.65)  VaR95/wk 2.54%   <- ADOPTED (kept the alpha, lower risk)
#   factor alpha  +6.4%/yr (t 1.25)  VaR95/wk 3.66%   (exchange factors are too coarse for stocks)
weighting: "hrp"
# Near-duplicate guard: skip a pick whose 1-year return correlation with a
# name already picked exceeds this (0 / left out = off).
#   python -m umushroom.cli --config config.yaml --compare-dedup equity:0.9,0.95
#   stocks: 0.90 VaR 3.23% / 0.95 VaR 3.21% vs 3.16% without -> KEEP OFF
#   ETFs:   0.90 VaR 2.88% / 0.95 alpha lower  vs 2.86% without -> KEEP OFF
#   (the twins the guard was built for are handled by factor-risk SIZING instead)
# max_pick_correlation: 0.9
# Refuse to run (and to cache) when Yahoo serves less than 90% of the
# universe -- a rate-limited download must never be traded (data.py).
max_missing_fraction: 0.10
top_n_holdings: 10              # v4.5: back to 10 -- won the 10-year
                                # head-to-head (alpha t=2.22) vs 25
lookback_period: "10y"          # v4.4: 10 years (each stock joins the model
                                # once it has a year of its own history)
# v4.21: fetch from a FIXED first date instead of a rolling 10 years. A rolling
# window starts one day later every day, which moved every training-sample
# date and fold boundary: the 26 and 27 Oct 2026 live runs shared 2 of 10
# stock picks on identical data, and the ETF walk-forward IC t jittered
# 1.9 <-> 3.1 from one day to the next. Bump this once a year.
history_start: "2016-10-01"
# v4.21: refuse to run when the data does not reach the last trading day
# (the pipeline exits 3 = "not ready"; the GitHub workflow retries later).
# Every Tue-Fri GitHub run of 20-27 Oct 2026 built signals on the close two
# days back because Yahoo publishes European closes after 07:00 UTC.
require_fresh_data: true
# v4.21: `selection: auto` switches between the model's picks and the core
# basket only after the rule has said the same thing on this many
# consecutive runs (it flipped the ETF sleeve on 4 of 6 live days).
auto_confirm_runs: 3
# v4.21: trade an `auto` sleeve's model picks only on a contest-window PASS
# (active t >= 2 AND win rate > 50%). Under the fixed history start the ETF
# picks had alpha -4.9%/yr, 6-week active t -0.83 and a 51% win rate --
# verdict WARN -- and the v4.19 rule ("not FAIL") still traded them.
auto_trade_on: "pass"
forward_return_days: 5          # v4.5: back to 5 days -- won the head-to-head
rebalance_days: 5               # backtest + live cadence
min_history_days: 300           # minimum clean bars required to run
model_alpha: 1.0                # Ridge regularization strength
random_seed: 42                 # for reproducibility

# --- Signal construction (v4) ---
# target: "rank"   = cross-sectional rank of forward return (default, robust)
#         "excess" = forward return minus same-exchange average
#         "raw"    = v3 behaviour (not recommended: mostly market noise)
target: "rank"
# Rank stocks against others on the SAME exchange, so country and
# currency moves don't masquerade as stock-picking signal.
neutralize_by_exchange: true
# HEAD-TO-HEAD RESULT (2026-10-08, 10 years of data, decided by a rule set
# BEFORE looking): the v4.3 stock setup -- exchange-neutral, 5-day horizon,
# top 10, price factors only -- beat sector-neutral/21-day/top-25/volume:
# alpha +11.1%/yr (t=+2.22) vs +5.1% (t=+1.19). So the settings below are
# the v4.3 ones; the 10-year + ragged DATA improvements are kept.
#
# v4.4: also rank within SECTOR (banks vs banks, miners vs miners), so the
# picks aren't one big sector bet. Sectors come from UMushroom's own data.
neutralize_by_sector: false   # v4.5: lost the head-to-head; kept off
sector_file: "umushroom_universe_mapped.csv"
# v4.4: add trading-volume factors (abnormal volume, Amihud illiquidity)
use_volume_features: false    # v4.5: lost the head-to-head; kept off
# v4.18: at most N equity picks per sector (off until it wins its head-to-head:
#   python -m umushroom.cli --config config.yaml --compare-sector-cap 3
# then add e.g.  max_per_sector: 3  only if the verdict says SWITCH THE CAP ON)
# max_per_sector: 3
# v4.4: keep stocks with partial history; each joins once it has a year
ragged_history: true
# Warn if more than this fraction of the universe is on one exchange.
max_single_exchange_fraction: 0.6
# Drop today's still-trading bar: UMushroom fills at the PREVIOUS close,
# so signals must be built only from completed daily bars.
drop_incomplete_bar: true
# Region for `umushroom --fama-french`: US | Developed | Europe
fama_french_region: "Developed"

cache_dir: ".cache"
cache_max_age_hours: 12         # re-fetch at most twice a trading day

log_level: "INFO"

# v4.19: Stage 1 is 30 trading days (12 Oct - 22 Nov 2026). Every sleeve's
# forecast horizon must fit inside it, and every sleeve is judged on rolling
# windows of this length (see window.py and the ETFs tab).
contest_window_days: 30

# --- Purged & embargoed walk-forward backtest settings ---
purged_test_window_days: 21     # length of each held-out test fold (~1 month)
purged_purge_days: 5            # gap before test fold; must be >= forward_return_days
purged_embargo_days: 5          # extra gap after test fold before next training
purged_min_train_days: 504      # ~2 years of history before the first test fold

# --- Prediction accuracy tracking ---
prediction_log_path: ".cache/prediction_log.csv"
max_per_sector: 3
